<!--
  Correo con el codigo de acceso.

  La clave es {{ .Token }}: eso imprime el codigo de 6 digitos.
  La plantilla por defecto de Supabase usa {{ .ConfirmationURL }}, que manda un
  link en vez de un codigo y obliga a abrir el correo en el mismo dispositivo.

  En produccion hay que hacer este mismo cambio a mano, en:
  supabase.com > Authentication > Emails > Magic Link
-->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 420px; margin: 0 auto; padding: 32px 24px; color: #171717;">
  <h1 style="font-size: 16px; font-weight: 500; margin: 0 0 8px;">
    Tu código de acceso
  </h1>

  <p style="font-size: 14px; line-height: 1.5; color: #525252; margin: 0 0 24px;">
    Escribí este código en el panel para entrar:
  </p>

  <p style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 32px; font-weight: 600; letter-spacing: 8px;
            margin: 0 0 24px; padding: 16px 0; text-align: center;
            background: #fafafa; border: 1px solid #e5e5e5; border-radius: 8px;">
    {{ .Token }}
  </p>

  <p style="font-size: 13px; line-height: 1.5; color: #737373; margin: 0;">
    El código vence en 15 minutos. Si no pediste entrar, ignorá este correo.
  </p>
</div>
